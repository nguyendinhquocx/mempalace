name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --cov-fail-under=80 --durations=10

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --cov-fail-under=80 --durations=10

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --cov-fail-under=80 --durations=10
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
      # Keep this pin identical to the `ruff==` pin in pyproject.toml
      # ([project.optional-dependencies].dev and [dependency-groups].dev)
      # so CI and `pip install -e ".[dev]"` format/lint identically.
      - run: pip install "ruff==0.15.14"
      - run: ruff check .
      - run: ruff format --check .

  test-rust:
    name: Test Rust Core & CLI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo test -p mempalace-core -p mempalace-cli --locked
      - run: pip install -e ".[dev]" "maturin>=1.7,<2"
      - name: Build and install native wheel
        run: pip install ./crates/mempalace-py
      - name: Verify native adapter (fallback cannot satisfy this job)
        env:
          MEMPALACE_REQUIRE_NATIVE: "1"
        run: >-
          python -m pytest tests/test_rust_exact_backend.py
          tests/test_backend_conformance.py tests/test_sqlite_exact_backend.py -v


