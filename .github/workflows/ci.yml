name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Gate is [tool.coverage.report] fail_under in pyproject.toml.
      # Do not pass --cov-fail-under.
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --durations=10

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --cov-fail-under=80 --durations=10

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --durations=10

  test-milvus:
    name: Measure Milvus extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: 'pip'
      # backends/milvus.py is omitted from the default gate (pymilvus is not
      # a dev dependency). This job measures that module. The package
      # threshold stays in pyproject.toml and is not restated here.
      # Pin the extra: milvus-lite 3.2 and pymilvus 3.0.2 fail this suite.
      - run: pip install -e ".[dev,milvus]" "pymilvus==3.0.0" "milvus-lite==3.0"
      - run: >-
          python -m pytest tests/test_milvus_backend.py -v
          --cov
          --cov-report=term-missing
          --cov-config=.github/coverage-milvus.toml
          --durations=10

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
      # Keep this pin identical to the `ruff==` pin in pyproject.toml
      # ([project.optional-dependencies].dev and [dependency-groups].dev)
      # so CI and `pip install -e ".[dev]"` format/lint identically.
      - run: pip install "ruff==0.15.14"
      - run: ruff check .
      - run: ruff format --check .
